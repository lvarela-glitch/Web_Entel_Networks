name: Publicar sitio Entel en Hostinger (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar por FTPS en sitio temporal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Obtener archivos del sitio
        uses: actions/checkout@v4

      - name: Sincronizar con Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.HOSTINGER_FTP_PORT || 21 }}
          local-dir: ./
          server-dir: ${{ vars.HOSTINGER_SERVER_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
