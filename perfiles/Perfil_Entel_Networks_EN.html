@keyframes heroFade{0%{filter:hue-rotate(0deg) brightness(.8);transform:scale(1)}50%{filter:hue-rotate(18deg) brightness(1);transform:scale(1.04)}100%{filter:hue-rotate(-12deg) brightness(.88);transform:scale(1.01)}}
.eyebrow{margin:0 0 12px;color:var(--cyan);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(40px,6vw,64px);line-height:1.05;letter-spacing:-.035em;margin:0 0 14px;color:#fff}
.lead{font-size:clamp(20px,2.4vw,25px);line-height:1.4;max-width:850px;margin:0 0 28px;color:#e8f3fc}
.flow{display:block;width:100%;height:auto;border-radius:12px;background:#08172c}
.caption{font-size:14px;color:#d2e1ed;text-align:center;margin:8px 0 0}
.section{padding:58px 0}
.section.alt{background:var(--pale)}
.kicker{font-size:14px;letter-spacing:.12em;font-weight:700;color:var(--blue);margin:0 0 5px}
h2{font-size:clamp(30px,4vw,42px);line-height:1.12;color:#000;margin:0 0 16px;letter-spacing:-.025em}
.section-intro{font-size:19px;line-height:1.55;max-width:850px;margin:0 0 26px}
.steps{display:grid;gap:12px}
.step{display:flex;align-items:flex-start;gap:20px;background:white;border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.step>span{display:grid;place-items:center;flex:0 0 54px;height:54px;border-radius:9px;background:var(--navy);color:var(--cyan);font-size:20px;font-weight:700}
h3{margin:0 0 5px;color:var(--navy);font-size:21px;line-height:1.25}
.step p,.service p{font-size:17px;margin:0;line-height:1.5}
.note{margin:22px 0 0;color:var(--muted);font-size:16px}
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.service{border:1px solid var(--border);border-radius:12px;padding:21px;background:#fff}
.service h3{font-size:19px}
.resilient{display:block;width:100%;height:auto;border-radius:12px;background:white;border:1px solid var(--border)}
.caption-dark{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 22px}
.capabilities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 30px;margin:0;padding:0;list-style:none}
.capabilities li{font-size:18px;line-height:1.5;padding-left:26px;position:relative}
.capabilities li:before{content:"";position:absolute;left:0;top:.67em;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.makers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
.maker{min-height:142px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}
.maker img{display:block;max-width:100%;width:min(100%,230px);height:46px;object-fit:contain}
.maker h3{font-size:17px;margin:0}
.network-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.network-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:21px}
.network-card p{font-size:17px;line-height:1.5;margin:0}
.network-maker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.network-maker{min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-decoration:none;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.network-maker img{width:44px;height:44px;object-fit:contain}
.network-maker span{font-size:16px;font-weight:700;text-align:center;color:var(--navy)}
.section,[id]{scroll-margin-top:94px}
.reference-models{margin-top:18px;padding:16px 18px;border-radius:12px;background:#fff;border:1px solid var(--border);font-size:16px;line-height:1.55}
.flowcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.flowcard{padding:20px;border-radius:12px;border:1px solid var(--border);background:#fff}
.flowcard p{margin:0;font-size:17px;line-height:1.5}
.contact{display:grid;grid-template-columns:110px 1fr;gap:25px;align-items:center;background:var(--pale);border:1px solid var(--border);border-radius:16px;padding:24px}
.spin{width:90px;height:90px;object-fit:contain;background:var(--navy);border-radius:12px}
.person{font-size:24px;color:var(--navy);font-weight:700;margin:0 0 3px}
.email{display:inline-block;color:var(--blue);font-size:clamp(21px,3vw,27px);font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.contact p{margin:4px 0;color:var(--muted);font-size:17px}
footer{padding:22px;color:#d2e1ed;background:var(--navy);font-size:15px;text-align:center}
.downloads{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.download-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 18px;border-radius:9px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;text-decoration:none}
.download-btn.secondary{background:#fff;color:var(--navy)}
.download-btn.outline,.language-link{border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff}
.language-link{padding:6px 10px;border-radius:8px}
@media(min-width:701px) and (max-width:1024px){
 :root{--max:920px}
 header{padding:12px 20px}
 .topbar{gap:16px}
 .brand img.logo{width:130px}
 nav{gap:10px 14px}
 nav a{font-size:14px}
 .wrap{width:min(calc(100% - 40px),var(--max))}
 .hero{min-height:430px;padding:58px 0 50px}
 .services,.capabilities,.network-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .makers{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
 .network-maker-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
 .flowcards{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .flowcard{padding:17px}
 .contact{grid-template-columns:90px 1fr;gap:18px}
}
@media(max-width:700px){
 body{font-size:18px;line-height:1.65}
 header{padding:14px 16px}
 .topbar{align-items:flex-start;flex-direction:column;gap:12px}
 .brand img.logo{width:130px}
 .brand span{font-size:13px}
 nav{justify-content:flex-start;gap:8px 16px}
 nav a{font-size:16px;padding:4px 0}
 .wrap{width:min(calc(100% - 32px),var(--max))}
 .hero{padding:34px 0 32px}
 h1{font-size:42px;line-height:1.08}
 .lead{font-size:21px;line-height:1.45}
 .section{padding:42px 0}
 h2{font-size:32px;line-height:1.15}
 .section-intro{font-size:19px}
 .steps,.services,.capabilities{grid-template-columns:1fr}
 .step{gap:14px;padding:17px}
 .step>span{flex-basis:48px;height:48px;font-size:18px}
 h3{font-size:20px}
 .step p,.service p{font-size:18px}
 .service{padding:19px}
 .capabilities li{font-size:18px}
 .makers{grid-template-columns:1fr;gap:12px}
 .maker{min-height:122px;padding:18px}
 .maker img{height:48px;width:min(100%,250px)}
 .maker h3{font-size:18px}
 .network-grid,.flowcards{grid-template-columns:1fr}
 .network-maker-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .network-maker{min-height:110px;padding:12px}
 .network-maker span{font-size:17px}
 .network-card p,.flowcard p{font-size:18px}
 .reference-models{font-size:17px;padding:16px}
 .contact{grid-template-columns:1fr;gap:14px;padding:20px}
 .spin{width:76px;height:76px}
 .person{font-size:23px}
 .email{font-size:22px}
 .contact p{font-size:18px}
 .downloads{display:grid;grid-template-columns:1fr}
 .download-btn{font-size:17px;text-align:center}
 .section,[id]{scroll-margin-top:150px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
